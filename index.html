<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>План квартиры</title>
  </head>
  <body>
    <main class="page">
      <section class="apartment">
        <h1 class="apartment__title">3-х комнатная квартира - 130 кв.м.</h1>

        <div class="floor-plan" aria-label="План квартиры">
          <div class="floor-plan__balcony-open">
            <div
              class="wall wall_type_railing floor-plan__wall"
              style="--wall-top: 0"
            ></div>
            <div
              class="wall wall_vertical wall_join_end wall_join-end-open_bottom floor-plan__wall"
              style="--wall-left: 0"
            ></div>
            <div
              class="wall wall_vertical wall_join_end wall_join-end-open_bottom floor-plan__wall"
              style="--wall-right: 0"
            ></div>
          </div>
          <!-- Непостредственно площадь квартиры -->
          <div class="floor-plan__inner">
            <!-- Стены несущие (квадрат) -->
            <div
              class="wall floor-plan__wall"
              style="--wall-left: 0; --wall-top: 0"
            >
              <div
                class="wall__window"
                style="--position: 15.78%; --length: 15.78%"
              ></div>
              <div
                class="wall__window"
                style="--position: 65.78%; --length: 15.78%"
              ></div>
              <div
                class="wall__door wall__door_join_end"
                style="--position: 60.52%; --length: 5.26%"
              ></div>
            </div>
            <div
              class="wall wall_vertical wall_join_start wall_join-start-open_left wall_join-start-open_top floor-plan__wall"
              style="--wall-right: 0; --wall-top: 0"
            >
              <div
                class="wall__door wall__door_join_end"
                style="--position: 47.4%; --length: 5.26%"
              ></div>
              <div
                class="wall__window"
                style="--position: 52.63%; --length: 10.53%"
              ></div>
              <div
                class="wall__door wall__door_join_end"
                style="--position: 73.68%; --length: 5.26%"
              ></div>
              <div
                class="wall__window"
                style="--position: 78.94%; --length: 10.53%"
              ></div>
            </div>
            <div
              class="wall wall_join_end wall_join-end-open_top floor-plan__wall"
              style="--wall-bottom: 0; --wall-right: 0"
            ></div>
            <div
              class="wall wall_vertical wall_join_start wall_join-start-open_right wall_join_end wall_join-end-open_right floor-plan__wall"
              style="--wall-left: 0; --wall-bottom: 0"
            >
              <div
                class="wall__door"
                style="--position: 52.63%; --length: 7.89%"
              ></div>
              <div class="wall__air-shaft" style="--position: 7.89%">
                <span></span>
                <span></span>
              </div>
              <div class="wall__air-shaft" style="--position: 86%">
                <span></span>
                <span></span>
              </div>
            </div>
            <!-- Контейнер с комнатами -->
            <div class="floor-plan__rooms">
              <div class="floor-plan__group floor-plan__group_day">
                <div class="room floor-plan__kitchen">
                  <span class="room__dimension room__dimension_top">3,55</span>
                  <span class="room__dimension room__dimension_left">4,76</span>
                  <div class="room__content">
                    <span class="room__name">Кухня</span>
                    <span class="room__area">16,9</span>
                  </div>
                </div>
                <div
                  class="wall wall_vertical wall_join_start wall_join_end wall_join-start-open_top wall_join-end-open_bottom wall_type_partition floor-plan__partition"
                ></div>
                <div class="room floor-plan__living">
                  <span class="room__dimension room__dimension_top">7,82</span>
                  <span class="room__dimension room__dimension_right"
                    >4,76</span
                  >
                  <div class="room__content">
                    <span class="room__name">Гостиная</span>
                    <span class="room__area">37,2</span>
                  </div>
                </div>
              </div>
              <div
                class="wall wall_type_partition wall_join_start wall_join_end wall_join-start-open_left wall_join-end-open_right"
              >
                <div
                  class="wall__door"
                  style="--position: 22%; --length: 7.24%"
                ></div>
                <div
                  class="wall__door"
                  style="--position: 38%; --length: 7.24%"
                ></div>
              </div>
              <div class="floor-plan__group floor-plan__group_private">
                <div class="floor-plan__group floor-plan__group_service"></div>
                <div
                  class="wall wall_vertical wall_join_start wall_join-start-open_top wall_join_end wall_join-end-open_bottom floor-plan__partition"
                >
                  <div
                    class="wall__door"
                    style="--position: 20%; --length: 15%"
                  ></div>
                  <div
                    class="wall__door"
                    style="--position: 52%; --length: 15%"
                  ></div>
                </div>
                <div class="floor-plan__group floor-plan__group_bedrooms">
                  <div class="room floor-plan__bedroom">
                    <span class="room__dimension room__dimension_right"
                      >3,17</span
                    >
                    <span class="room__dimension room__dimension_bottom"
                      >5,53</span
                    >
                    <div class="room__content">
                      <span class="room__name">Спальня</span>
                      <span class="room__area">17,3</span>
                    </div>
                  </div>
                  <div
                    class="wall wall_type_partition wall_join_start wall_join-start-open_left wall_join_end wall_join-end-open_right"
                  ></div>
                  <div class="room floor-plan__bedroom">
                    <span class="room__dimension room__dimension_right"
                      >3,43</span
                    >
                    <span class="room__dimension room__dimension_top"
                      >5,53</span
                    >
                    <div class="room__content">
                      <span class="room__name">Спальня</span>
                      <span class="room__area">19,0</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="floor-plan__balcony-glazed">
            <div
              class="wall wall_vertical wall_type_glass floor-plan__wall"
              style="--wall-right: 0"
            ></div>
            <div
              class="wall wall_join_start wall_join-start-open_left floor-plan__wall"
              style="--wall-top: 0"
            ></div>
            <div
              class="wall wall_join_start wall_join-start-open_left floor-plan__wall"
              style="--wall-bottom: 0"
            ></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
